<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">OpenNice gaming portal logo</title>
  <!-- 关键模块：霓虹传送门与手柄按键结合，保证浏览器标签的小尺寸辨识度。 -->
  <defs>
    <linearGradient id="panel" x1="8" y1="5" x2="56" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#153247"/>
      <stop offset=".46" stop-color="#07131F"/>
      <stop offset="1" stop-color="#040A11"/>
    </linearGradient>
    <linearGradient id="portal" x1="13" y1="15" x2="53" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFFAFF"/>
      <stop offset=".24" stop-color="#62E6FF"/>
      <stop offset=".72" stop-color="#1EB7E8"/>
      <stop offset="1" stop-color="#087BAE"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="18" fill="#03080E"/>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#panel)" stroke="#28657A" stroke-width="1.5"/>
  <path d="M13 20 20 10h24l8 9-3 4-8-6H23l-6 8Z" fill="#62E6FF" opacity=".11"/>

  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#0A3142" stroke-width="8"/>
  <path
    d="M45.1 18.9A18.5 18.5 0 1 0 48.3 42.6"
    fill="none"
    stroke="url(#portal)"
    stroke-linecap="round"
    stroke-width="7"
    filter="url(#glow)"
  />
  <path d="m47.1 44.4 5.7-1.8-1.7 5.8Z" fill="#A8F52A"/>

  <!-- 关键模块：左侧方向键与右侧动作键强化“游戏平台”识别。 -->
  <path d="M17.1 28.7h3.2v-3.2h3.4v3.2h3.2v3.4h-3.2v3.2h-3.4v-3.2h-3.2Z" fill="#E8FBFF"/>
  <circle cx="42.2" cy="28.2" r="2.35" fill="#A8F52A"/>
  <circle cx="46.2" cy="34.5" r="2.35" fill="#62E6FF"/>
  <path d="M32 15.2v3.1M32 45.7v3.1" stroke="#DFFAFF" stroke-linecap="round" stroke-width="1.7" opacity=".7"/>
</svg>
