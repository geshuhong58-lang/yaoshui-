<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 关键模块：旧播放器地址只作兼容跳转，不再包含任何第三方游戏嵌入。 -->
    <title>Game Page Moved | OpenNice</title>
    <meta name="description" content="This OpenNice game page has moved to a dedicated address.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#101218">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">

    <script>
      // 关键模块：只允许跳转到站内六个固定详情页，避免把用户带到未经审核的地址。
      const gamePages = {
        "marvel-rivals": "marvel-rivals.html",
        "mr-mine": "mr-mine.html",
        "poker-quest": "poker-quest.html",
        "grindcraft": "grindcraft.html",
        "fray-fight": "fray-fight.html",
        "world-of-eggs": "world-of-eggs.html"
      };

      // 关键模块：读取旧链接中的 game 参数；无匹配时返回安全的游戏目录。
      const requestedGame = new URLSearchParams(window.location.search).get("game");
      const destination = gamePages[requestedGame] || "catalog.html";
      window.location.replace(destination);
    </script>
  </head>
  <body class="redirect-page">
    <main class="redirect-card">
      <p class="section-kicker">OpenNice</p>
      <h1>Page moved.</h1>
      <p>The game now has its own dedicated page. Redirecting you to the current collection…</p>
      <a class="button button-primary" href="catalog.html">Browse all games</a>
    </main>
  </body>
</html>
